resource:
    name: SupplierLocations
    shortName: SupplierLocation
    description: The locations of a supplier

    provider: SprykerAcademy\Glue\Supplier\Api\Backend\Provider\SupplierLocationsBackendProvider

    # A supplier has a handful of locations: no paging
    paginationEnabled: false

    operations:
        - type: GetCollection
          uriTemplate: /suppliers/{idSupplier}/supplier-locations
          uriVariables:
              idSupplier:
                  fromClass: SuppliersBackendResource
        - type: Get
          uriTemplate: /supplier-locations/{idSupplierLocation}

    properties:
        idSupplierLocation:
            type: int
            description: The unique supplier location identifier
            identifier: true
        idSupplier:
            type: int
            description: The supplier the location belongs to
        city:
            type: string
            description: City
        country:
            type: string
            description: Country
        address:
            type: string
            description: Street and house number
        zipCode:
            type: string
            description: Zip code
        isDefault:
            type: bool
            description: Whether this is the default location of the supplier
