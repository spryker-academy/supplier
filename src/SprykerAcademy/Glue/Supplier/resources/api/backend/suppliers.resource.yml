resource:
    name: Suppliers
    shortName: Supplier
    description: Supplier management API for back-office integrations

    provider: SprykerAcademy\Glue\Supplier\Api\Backend\Provider\SuppliersBackendProvider

    # GET /suppliers?page[offset]=2&page[limit]=2 - the provider cuts the page out, see provideCollection()
    paginationEnabled: true
    paginationItemsPerPage: 10

    operations:
        - type: Get
        - type: GetCollection

    # GET /suppliers?include=supplier-locations
    includes:
        - relationshipName: supplier-locations
          targetResource: SupplierLocations
          uriTemplate: /suppliers/{idSupplier}/supplier-locations
          uriVariableMappings:
              idSupplier: idSupplier

    properties:
        idSupplier:
            type: int
            description: The unique supplier identifier
            identifier: true
        name:
            type: string
            description: Supplier name
        description:
            type: string
            description: Supplier description
        status:
            type: int
            description: Supplier status where 1 is active and 0 is inactive
        email:
            type: string
            description: Supplier email
        phone:
            type: string
            description: Supplier phone
        pagination:
            type: object
            objectName: Pagination
            description: Pagination of the collection. Set on its first item only; Glue builds the first/prev/next/last links from it.
            writable: false
            properties:
                numFound:
                    type: integer
                    description: Number of suppliers in all pages
                currentPage:
                    type: integer
                    description: The page of this response, starting at 1
                maxPage:
                    type: integer
                    description: The last page
                currentItemsPerPage:
                    type: integer
                    description: Suppliers per page
